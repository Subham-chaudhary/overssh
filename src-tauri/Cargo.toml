[package]
name = "overssh"
version = "1.4.0"
description = "Edit and browse remote VMs over plain SSH/SFTP"
edition = "2021"

[lib]
name = "overssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
